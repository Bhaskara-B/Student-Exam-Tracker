<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JEE Study Tracker Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen">
  <div class="max-w-5xl mx-auto px-4 py-6">
    <div class="flex justify-between items-center mb-6">
      <div>
        <h1 class="text-3xl font-bold">JEE Study Tracker Pro</h1>
        <p class="text-slate-400">Daily study, goals, tests, and countdown — all in one place.</p>
      </div>
      <div id="countdown" class="text-right text-emerald-400 font-semibold"></div>
    </div><div class="grid md:grid-cols-4 gap-4 mb-6">
  <div class="bg-slate-900 rounded-2xl p-4"><p class="text-slate-400">Topics</p><p id="topicsCount" class="text-3xl font-bold">0</p></div>
  <div class="bg-slate-900 rounded-2xl p-4"><p class="text-slate-400">Hours</p><p id="hoursCount" class="text-3xl font-bold">0</p></div>
  <div class="bg-slate-900 rounded-2xl p-4"><p class="text-slate-400">Mock Tests</p><p id="testCount" class="text-3xl font-bold">0</p></div>
  <div class="bg-slate-900 rounded-2xl p-4"><p class="text-slate-400">Average Score</p><p id="avgScore" class="text-3xl font-bold">0%</p></div>
</div>

<div class="grid md:grid-cols-2 gap-6">
  <section class="bg-slate-900 rounded-2xl p-5">
    <h2 class="text-xl font-semibold mb-3">Add Study Session</h2>
    <form id="studyForm" class="space-y-3">
      <input id="topic" placeholder="Topic name" class="w-full p-3 rounded-lg bg-slate-800" />
      <select id="subject" class="w-full p-3 rounded-lg bg-slate-800">
        <option>Physics</option>
        <option>Chemistry</option>
        <option>Maths</option>
      </select>
      <input id="hours" type="number" step="0.5" placeholder="Hours studied" class="w-full p-3 rounded-lg bg-slate-800" />
      <button class="w-full bg-emerald-600 py-3 rounded-lg font-semibold">Add Session</button>
    </form>
    <div id="studyList" class="mt-4 space-y-2"></div>
  </section>

  <section class="bg-slate-900 rounded-2xl p-5">
    <h2 class="text-xl font-semibold mb-3">Mock Test Scores</h2>
    <form id="testForm" class="flex gap-2 mb-4">
      <input id="score" type="number" placeholder="Score %" class="flex-1 p-3 rounded-lg bg-slate-800" />
      <button class="bg-blue-600 px-4 rounded-lg">Add</button>
    </form>
    <div id="testList" class="space-y-2"></div>
  </section>
</div>

  </div><script>
const studyForm = document.getElementById('studyForm');
const testForm = document.getElementById('testForm');
let study = JSON.parse(localStorage.getItem('jee-study')||'[]');
let tests = JSON.parse(localStorage.getItem('jee-tests')||'[]');

function save(){
 localStorage.setItem('jee-study', JSON.stringify(study));
 localStorage.setItem('jee-tests', JSON.stringify(tests));
}

function render(){
 document.getElementById('topicsCount').textContent = study.length;
 document.getElementById('hoursCount').textContent = study.reduce((a,b)=>a+Number(b.hours),0);
 document.getElementById('testCount').textContent = tests.length;
 document.getElementById('avgScore').textContent = tests.length ? Math.round(tests.reduce((a,b)=>a+b,0)/tests.length)+'%' : '0%';

 document.getElementById('studyList').innerHTML = study.map((s,i)=>`
 <div class='bg-slate-800 p-3 rounded-xl flex justify-between'>
 <div>${s.subject}: ${s.topic} — ${s.hours}h</div>
 <button onclick='removeStudy(${i})' class='text-red-400'>✕</button>
 </div>`).join('');

 document.getElementById('testList').innerHTML = tests.map((t,i)=>`
 <div class='bg-slate-800 p-3 rounded-xl flex justify-between'>
 <div>${t}%</div>
 <button onclick='removeTest(${i})' class='text-red-400'>✕</button>
 </div>`).join('');
 save();
}

studyForm.onsubmit=(e)=>{
 e.preventDefault();
 study.unshift({
  topic:topic.value,
  subject:subject.value,
  hours:hours.value
 });
 studyForm.reset();
 render();
}

testForm.onsubmit=(e)=>{
 e.preventDefault();
 tests.unshift(Number(score.value));
 testForm.reset();
 render();
}

function removeStudy(i){study.splice(i,1);render();}
function removeTest(i){tests.splice(i,1);render();}
window.removeStudy=removeStudy;
window.removeTest=removeTest;

function countdown(){
 const exam = new Date('2027-01-15');
 const diff = exam - new Date();
 const d = Math.floor(diff/(1000*60*60*24));
 document.getElementById('countdown').textContent = d + ' days to JEE';
}
countdown();
render();
</script></body>
                                                                                       </html>
