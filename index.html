<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Study Tracker — Fixed</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen p-6">
<div class="max-w-4xl mx-auto">
<h1 class="text-3xl font-bold mb-6">Study Tracker</h1>

<div class="bg-white rounded-xl p-5 shadow mb-6">
<form id="topicForm" class="flex gap-3 flex-col sm:flex-row">
<input id="topicInput" placeholder="Add topic…" class="flex-1 border rounded-lg p-3"/>
<input id="hoursInput" type="number" min="0" step="0.5" placeholder="Hours" class="border rounded-lg p-3 w-32"/>
<button class="bg-emerald-600 text-white px-5 py-3 rounded-lg">Add</button>
</form>
</div>

<div class="grid grid-cols-2 gap-4 mb-6">
<div class="bg-white rounded-xl p-5 shadow">
<p class="text-sm text-slate-500">Topics Completed</p>
<p id="topicCount" class="text-3xl font-bold">0</p>
</div>
<div class="bg-white rounded-xl p-5 shadow">
<p class="text-sm text-slate-500">Total Hours</p>
<p id="hourCount" class="text-3xl font-bold">0</p>
</div>
</div>

<div id="topicList" class="space-y-3"></div>
</div>

<script>
const form = document.getElementById('topicForm');
const topicInput = document.getElementById('topicInput');
const hoursInput = document.getElementById('hoursInput');
const topicList = document.getElementById('topicList');
const topicCount = document.getElementById('topicCount');
const hourCount = document.getElementById('hourCount');

let topics = JSON.parse(localStorage.getItem('study-tracker-data') || '[]');

function save(){
  localStorage.setItem('study-tracker-data', JSON.stringify(topics));
}

function render(){
  topicList.innerHTML = '';
  topicCount.textContent = topics.length;
  hourCount.textContent = topics.reduce((a,b)=>a + Number(b.hours),0);

  topics.forEach((topic,index)=>{
    const div = document.createElement('div');
    div.className = 'bg-white rounded-xl p-4 shadow flex justify-between items-center';
    div.innerHTML = `
      <div>
        <div class="font-semibold">${topic.name}</div>
        <div class="text-sm text-slate-500">${topic.hours} hrs</div>
      </div>
      <button class="text-red-500 font-semibold">Delete</button>
    `;
    div.querySelector('button').onclick = ()=>{
      topics.splice(index,1);
      save();
      render();
    };
    topicList.appendChild(div);
  });
}

form.addEventListener('submit', (e)=>{
  e.preventDefault();
  const name = topicInput.value.trim();
  const hours = hoursInput.value;

  if(!name || !hours) return;

  topics.unshift({name, hours});
  save();
  render();

  topicInput.value = '';
  hoursInput.value = '';
});

render();
</script>
</body>
</html>
